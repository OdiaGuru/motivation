<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devotional Poster Prompt Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1f6;--card:#fff;--ink:#1f1626;--mute:#6b5f75;--line:#e3dce8;--acc:#b8470a;--acc2:#7a1f3d;--chip:#f3edf6;--out:#1a0f1f;--outink:#f6eee4;--gold:#f0b429}
[data-theme=dark]{--bg:#150d1b;--card:#21172a;--ink:#f3ecf7;--mute:#a597b2;--line:#392a45;--acc:#ff9a4d;--acc2:#e58aa8;--chip:#2c2037;--out:#0d0712;--outink:#f6eee4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:5rem}
h1,h2{font-family:'Marcellus',Georgia,serif;font-weight:400}
header{background:#3a0f26;color:#fbe9c8;padding:1.6rem 1rem 1.4rem;border-bottom:4px solid var(--gold);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 20px);opacity:.55}
.wrap{max-width:1240px;margin:0 auto;padding:0 1rem}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
h1{font-size:1.9rem}header p{opacity:.8;font-size:.95rem}
.tbtn{background:transparent;border:1px solid #fbe9c880;color:inherit;border-radius:99px;padding:.4rem 1rem;cursor:pointer;font:inherit;font-size:.85rem}
main{display:grid;gap:1.5rem;margin-top:2rem}
@media(min-width:1000px){main{grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr)}.side{position:sticky;top:1rem;align-self:start}.bar{display:none}}
.presets{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.4rem}
.presets span{font-size:.85rem;color:var(--mute);margin-right:.2rem}
.sec{font-size:1.25rem;margin:1.4rem 0 .6rem;color:var(--acc2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-bottom:.8rem}
.card.off{opacity:.5}
.ch{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.6rem}
.ch label{display:flex;align-items:center;gap:.5rem;font-weight:600;cursor:pointer}
.ch small{color:var(--mute);font-size:.78rem;text-align:right}
input[type=checkbox]{accent-color:var(--acc);width:1.05rem;height:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:6px;padding:.38rem .7rem;font:inherit;font-size:.86rem;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
[data-theme=dark] .chip[aria-pressed=true]{color:#1a0f1f}
.chip.cu{border-style:dashed;border-color:var(--line)}
.desc{margin-top:.6rem;font-size:.8rem;color:var(--mute);border-left:3px solid var(--gold);padding-left:.6rem}
textarea,input[type=text],select{width:100%;padding:.65rem .75rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-size:.95rem}
textarea:focus,input:focus,select:focus,.chip:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.cust{margin-top:.6rem}
.row{display:grid;gap:.8rem}@media(min-width:620px){.row.two{grid-template-columns:1fr 2fr}}
.row label.l{font-weight:600;font-size:.88rem;display:block;margin-bottom:.3rem}
.out{background:var(--out);color:var(--outink);border-radius:10px;padding:1rem;max-height:62vh;overflow:auto}
.part{white-space:pre-wrap;font:.84rem/1.6 ui-monospace,Menlo,Consolas,monospace;padding:.15rem 0 .15rem .8rem;margin-bottom:.7rem;border-left:3px solid var(--gold)}
.part.g{border-color:#7fd1a8}.part.n{border-color:#ef7a7a}.part.c{border-color:#8fb4ff}
.lv{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:.7rem 0}
.lv button{flex:1;padding:.5rem;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;cursor:pointer}
.lv button[aria-pressed=true]{background:var(--acc2);color:#fff}
.stats{font-size:.8rem;color:var(--mute);margin:.5rem 0}
.btns{display:flex;gap:.5rem}
.btn{flex:1;padding:.8rem;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
[data-theme=dark] .btn{color:#1a0f1f}
.btn.s{background:var(--chip);color:var(--ink);flex:.6}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:.6rem 1rem;display:flex;gap:.5rem}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:#1f7a4d;color:#fff;padding:.5rem 1rem;border-radius:99px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
 <div><h1>Devotional Poster Prompt Studio</h1><p>Build detailed image prompts for deity posters with exact regional-script text.</p></div>
 <button class="tbtn" id="theme">Dark mode</button>
</div></header>

<div class="wrap"><main>
<div id="form">
 <div class="presets" id="presets"><span>Start from a template:</span></div>

 <h2 class="sec">Your text</h2>
 <div class="card">
  <div class="row two">
   <div><label class="l" for="lang">Script / language</label><select id="lang"></select></div>
   <div><label class="l" for="title">Heading text</label><input type="text" id="title" value="ଏ ସଂସାରରେ ୫ଟି ସବୁଠାରୁ ବଡ ଜିନିଷ"></div>
  </div>
  <div class="ch" style="margin:.9rem 0 .4rem"><label><input type="checkbox" id="onText" checked> Body lines (one per line)</label><small id="lc"></small></div>
  <textarea id="body" rows="6">୧)ସବୁଠାରୁ ବଡ଼ ସମ୍ପତି : ନିଜ ବୁଦ୍ଧି
୨)ସବୁଠାରୁ ଶକ୍ତିଶାଳୀ ଅସ୍ତ୍ର : ଧୌର୍ଯ୍ୟ
୩)ସବୁଠାରୁ ଭଲ ସୁରକ୍ଷା ହେଉଛି : ବିଶ୍ବାସ
୪)ସବୁଠାରୁ ଭଲ ଔଷଧ ହେଉଛି : ହସ
୫)ଆଉ ସବୁଠୁ ଆଶ୍ଚର୍ଯ୍ୟ କଥା : ଏସବୁ ମାଗଣା</textarea>
 </div>
 <div id="groups"></div>
</div>

<aside class="side">
 <h2 class="sec" style="margin-top:0">Your prompt</h2>
 <div class="lv" id="lv" role="group" aria-label="Detail level">
  <button data-v="1">Concise</button><button data-v="2">Detailed</button><button data-v="3">Maximum</button>
 </div>
 <div class="out" id="out"></div>
 <div class="stats" id="stats"></div>
 <div class="btns"><button class="btn" id="copy">Copy prompt</button><button class="btn s" id="dl">Download .txt</button></div>
</aside>
</main></div>
<div class="bar"><button class="btn" id="copy2">Copy prompt</button></div>
<div class="toast" id="toast">Prompt copied</div>

<script>
const $=s=>document.querySelector(s);
const dot=s=>/[.!?]$/.test(s.trim())?s.trim():s.trim()+'.';

const LANG=[
 ['Odia','Odia (ଓଡ଼ିଆ)','conjunct ligatures (e.g. କ୍ଷ, ଜ୍ଞ), vowel signs (matras) and the chandrabindu'],
 ['Hindi','Hindi Devanagari','the unbroken shirorekha headline, conjuncts and vowel signs (matras)'],
 ['Sanskrit','Sanskrit Devanagari','the shirorekha, conjuncts, anusvara, visarga and vowel signs (matras)'],
 ['Bengali','Bengali (বাংলা)','conjunct ligatures, hasanta and vowel signs'],
 ['Telugu','Telugu (తెలుగు)','stacked conjuncts and vowel signs'],
 ['Tamil','Tamil (தமிழ்)','pulli dots and vowel signs'],
 ['Gujarati','Gujarati (ગુજરાતી)','conjuncts and vowel signs (matras)'],
 ['English','English','exact spelling and punctuation']
];

// [name, prompt text]. Each group's last chip is always "Custom".
const G=[
{k:'layout',sec:'Canvas & artwork',t:'Canvas & aspect ratio',items:[
 ['Vertical story 9:16','vertical poster format (9:16 aspect ratio), made for phone status and stories.'],
 ['Square 1:1','square social media format (1:1 aspect ratio).'],
 ['Portrait 4:5','portrait feed format (4:5 aspect ratio).'],
 ['Print portrait 3:4','print-ready portrait poster format (3:4 aspect ratio) with a generous safe margin.'],
 ['Banner 16:9','horizontal banner format (16:9 aspect ratio).']]},
{k:'subject',t:'Deity / main subject',items:[
 ['Ganesha','Lord Ganesha seated on a lotus in a blessing (abhaya) pose, gentle smile, one hand raised in blessing and one holding modak, a small mouse at his feet, a soft golden halo behind his head.'],
 ['Hanuman','Lord Hanuman in a powerful blessing pose, holding a golden gada, saffron-hued with glowing radiant energy and folded devotion.'],
 ['Laxmi','Goddess Laxmi seated gracefully on a pink lotus, gold coins pouring from her hand, two elephants lifting water pots above her, radiating wealth and light.'],
 ['Radha Krishna','Radha and Krishna standing together lovingly under a glowing moonlit banyan tree, Krishna with a flute and peacock feather.'],
 ['Jagannath trio','Lord Jagannath, Balabhadra and Subhadra in a vibrant detailed illustration, framed by an ornate traditional stone archway (torana), with no stray artifacts or limbs.'],
 ['Shiva & Parvati','a close-up divine portrait of Lord Shiva and Goddess Parvati; Shiva has light blue skin and a crescent moon in his hair, Parvati wears fine traditional Indian ornaments.'],
 ['Saraswati','Goddess Saraswati in a white sari seated on a white lotus, playing the veena, a swan beside her and a gentle luminous glow.'],
 ['Durga','Goddess Durga on a golden lion with a calm, compassionate face and a radiant halo, her many arms holding traditional symbols, drawn symmetrically and anatomically clean.'],
 ['Vishnu','Lord Vishnu standing in a yellow dhoti with blue skin, holding the shankha, chakra, gada and padma, wearing a Kaustubha gem and a jewelled crown.'],
 ['Ram Darbar','Lord Ram, Sita, Lakshman and Hanuman in a serene Ram Darbar composition, seated and facing the viewer, balanced and symmetrical.'],
 ['Kartikeya','Lord Kartikeya (Murugan) as a youthful warrior with a golden vel, standing beside his peacock, bright and graceful.'],
 ['Venkateshwara','Lord Venkateshwara (Balaji) standing tall with the traditional namam, heavily ornamented in gold jewellery and a tall crown.'],
 ['Surya Dev','Surya Dev, the Sun God, riding a seven-horse chariot with a large radiant solar halo, Konark-inspired wheel carvings.'],
 ['Annapurna','Goddess Annapurna seated on a throne holding a golden ladle and a vessel of food, a warm and nourishing presence.']]},
{k:'art',t:'Artistic rendering style',items:[
 ['Modern digital','modern digital devotional painting with soft dramatic lighting'],
 ['Calendar lithograph','high-resolution, rich-color lithograph-style Hindu calendar art'],
 ['Watercolor','traditional Indian watercolor painting with intricate detailing'],
 ['3D cinematic','3D realistic cinematic render with a warm divine glow and ornate gold accents'],
 ['Studio photo','studio photography style with warm studio lights and crisp background details'],
 ['Pattachitra','Odisha Pattachitra folk painting with bold black outlines, flat natural pigment colors, large expressive eyes and a decorated vine border'],
 ['Tanjore gold','Tanjore painting with raised gold-foil relief, inset gem accents and deep jewel-tone colors'],
 ['Madhubani','Madhubani folk art with fine line hatching, double-line outlines and dense floral and fish motifs'],
 ['Flat vector','clean flat vector illustration with smooth gradients, crisp shapes and a limited harmonious palette'],
 ['Ravi Varma oil','classical oil painting in the manner of Raja Ravi Varma, with soft realistic faces, rich drapery and luminous skin tones']]},
{k:'bg',t:'Background & scenery',items:[
 ['Galaxy','Universe galaxy view'],
 ['Himalayan peaks','Clean, texture-rich paper-white background set against snow-covered Himalayan peaks under a bright, golden-sunlit sky with divine glowing radial auras.'],
 ['Ganges at sunset','A serene riverbank of the Ganges at sunset with soft glowing oil lamps and holy temples fading into the mist, over a deep maroon background with subtle mandala patterns.'],
 ['Temple courtyard','A warm temple courtyard at dusk lit by rows of brass diyas, carved stone pillars softly blurred in the distance.'],
 ['Lotus pond dawn','A still lotus pond at dawn with pink and white lotuses, light mist and a gentle golden sunrise.'],
 ['Jagannath temple sunrise','The silhouette of the Puri Jagannath temple spire against a saffron sunrise sky with a flag fluttering on top.'],
 ['Marigold festive','A festive backdrop of marigold garlands, scattered petals and hanging brass bells.'],
 ['Saffron-maroon gradient','A smooth saffron-to-deep-maroon gradient with a faint radial glow behind the deity and subtle mandala watermark patterns.']]},
{k:'palette',t:'Color palette',items:[
 ['Saffron, maroon & gold','Saffron orange, deep maroon and metallic gold, with warm ivory highlights.'],
 ['Royal blue & gold','Deep royal blue, bright gold and soft white, with a calm and majestic mood.'],
 ['Emerald & gold','Rich emerald green, antique gold and cream, a prosperous and fresh mood.'],
 ['Rose & lotus pink','Lotus pink, rose and warm white with touches of gold, a soft and gentle mood.'],
 ['White & gold minimal','Pure white and soft gold on a quiet neutral base, clean and uncluttered.'],
 ['Sunrise glow','Warm gradient of sunrise yellow, peach and coral with a deep plum accent for text.']]},
{k:'panel',sec:'Layout & typography',t:'Text panel container',items:[
 ['Seamless flat','A minimal, seamless flat container matching the color tone of the canvas.'],
 ['Maroon mandala','A deep maroon textured background overlay with subtle, faded mandala patterns.'],
 ['Off-white card','A clean, central, slightly off-white instructional card panel overlays the lower portion of the image.'],
 ['Parchment scroll','An elegant, semi-transparent parchment-textured scroll panel overlays the bottom center.'],
 ['Carved wood door','A carved dark-wood temple door panel with brass studs, softly lit from above.'],
 ['Frosted glass','A frosted translucent glass panel with soft rounded corners over a blurred background.']]},
{k:'heading',t:'Heading banner design',items:[
 ['Green stroke','Below the deity illustration, a prominent horizontal green brushstroke banner serves as the title background, with the title in clean white script.'],
 ['Blue stroke','Below the deity illustration, a prominent horizontal deep blue brushstroke banner serves as the title background, with the title in clean white script.'],
 ['Red stroke','Below the deity illustration, a prominent vibrant red brushstroke banner serves as the title background, with the title in bold white script.'],
 ['Saffron stroke','Below the deity illustration, a prominent horizontal saffron brushstroke banner serves as the title background, with the title in stylized white script.'],
 ['Gold plate','Below the illustration, a sleek metallic golden plate serves as the title background, with the title in bold dark navy script.'],
 ['Minimal rectangle','Below the illustration, a clean geometric rectangle frame outlines the header space, with the title in elegant bold red.'],
 ['Ribbon scroll','Below the illustration, a curved ribbon banner with folded ends in deep red, with the title in cream lettering.'],
 ['Temple arch plaque','Below the illustration, a temple-arch shaped plaque with carved gold edges holds the title in deep maroon lettering.']]},
{k:'hfont',t:'Heading font style',items:[
 ['Bold rounded','bold, rounded, friendly {S} display lettering with even stroke weight'],
 ['Brush calligraphy','expressive brush-calligraphy {S} lettering with confident, flowing strokes'],
 ['Classic serif','classic high-contrast serif {S} lettering, formal and elegant'],
 ['Gold embossed','embossed metallic gold {S} lettering with a subtle bevel and soft shadow'],
 ['Carved inscription','temple-inscription style {S} lettering that looks carved into stone'],
 ['Modern geometric','modern geometric sans-serif {S} lettering with clean, uniform strokes']]},
{k:'bodyStyle',t:'Body text layout',items:[
 ['Handwritten + underline','Handwriting style text with colour pen underline for important text.'],
 ['Multi-color highlights','The text is cleanly arranged with generous line spacing, in a dark, highly legible bold sans-serif font, highlighted with soft pastel highlighter bands (alternating blue, yellow, green, pink, orange and purple behind each line).'],
 ['Minimal color bands','Each line is cleanly isolated over a subtle color-coded band in a modern bold geometric charcoal font.'],
 ['Gold calligraphy','The text is inscribed in high-contrast gold metallic calligraphy with a subtle drop shadow, spaced generously for maximum poster readability.'],
 ['Neon on dark','Crisp white neon-style typography over a dark semi-translucent backdrop with distinct line numbering and bolded keywords.'],
 ['Elegant serif','Elegant serif typography in deep navy blue, left-aligned with subtle bullet accents and soft line separators.'],
 ['Numbered medallions','Each line has a round gold numbered medallion on the left and bold dark text on the right, evenly spaced and left-aligned.'],
 ['Notebook paper','Text written on lined notebook paper with a red margin line, in neat dark-blue ink with key words circled.']]},
{k:'bfont',t:'Body font style',items:[
 ['Clean bold sans','bold, highly legible, open {S} sans-serif'],
 ['Traditional serif','traditional book-style {S} serif with moderate contrast'],
 ['Handwritten','natural, neat {S} handwriting font with consistent letter sizes'],
 ['Calligraphic','flowing calligraphic {S} script with graceful stroke endings'],
 ['Rounded friendly','soft rounded {S} font with generous letter spacing'],
 ['Manuscript','palm-leaf manuscript inspired {S} lettering, upright and evenly spaced']]},
{k:'border',sec:'Frame',t:'Framing & borders',items:[
 ['Floral border','Floral border'],
 ['Gold & red ornamental','A decorative gold and red traditional Indian ornamental border frames the entire design, ensuring a classic poster aesthetic. The complete layout is balanced and ultra-sharp.'],
 ['Minimal gold frame','A sleek, modern minimal gold border outlines the composition with high-contrast graphic balance.'],
 ['Brass temple arch','An intricate metallic brass temple arch (mandap) frames the full composition with detailed carved motifs.'],
 ['Glowing halo','A subtle glowing golden light halo border frames the inner edge of the canvas for a divine lighting effect.'],
 ['Vintage floral corners','A delicate vintage floral corner accent frame keeps the edges light while grounding the four corners.'],
 ['Pattachitra vine','A Pattachitra-style border of red and yellow vines, small peacocks and lotus buds running around the edge.'],
 ['No border','No border or frame; the artwork bleeds cleanly to the canvas edge.']]}
];
const GM={};G.forEach(g=>{GM[g.k]=g;g.items.push(['Custom…','']);});
const S={},ON={},CU={};
G.forEach(g=>{S[g.k]=0;ON[g.k]=true;CU[g.k]='';});
let LV=2;

const PRESETS=[
 ['Wisdom card',{}],
 ['Rath Yatra',{subject:4,art:5,bg:5,palette:0,border:6,heading:3}],
 ['Lakshmi Puja',{subject:2,art:6,bg:6,palette:0,border:1,heading:4}],
 ['Saraswati Puja',{subject:6,art:2,bg:4,palette:4,border:4,heading:1}],
 ['Maha Shivaratri',{subject:5,art:3,bg:1,palette:1,border:3,heading:4}]
];

// ---------- build UI ----------
const groups=$('#groups');
let lastSec='';
G.forEach(g=>{
 if(g.sec){const h=document.createElement('h2');h.className='sec';h.textContent=g.sec;groups.appendChild(h);}
 const c=document.createElement('div');c.className='card';c.id='card-'+g.k;
 c.innerHTML=`<div class="ch"><label><input type="checkbox" checked data-on="${g.k}"> ${g.t}</label><small></small></div><div class="chips"></div><div class="desc"></div><textarea class="cust" rows="2" hidden placeholder="Describe it in your own words…"></textarea>`;
 groups.appendChild(c);
 const chips=c.querySelector('.chips');
 g.items.forEach((it,i)=>{
  const b=document.createElement('button');b.type='button';b.className='chip'+(i===g.items.length-1?' cu':'');b.textContent=it[0];b.dataset.k=g.k;b.dataset.i=i;chips.appendChild(b);
 });
});
$('#lang').innerHTML=LANG.map((l,i)=>`<option value="${i}">${l[1]}</option>`).join('');
const pr=$('#presets');
PRESETS.forEach(p=>{const b=document.createElement('button');b.className='chip';b.textContent=p[0];b.onclick=()=>{Object.assign(S,p[1]);sync();};pr.appendChild(b);});

function sync(){
 G.forEach(g=>{
  const c=$('#card-'+g.k),n=g.items.length-1,isCu=S[g.k]===n;
  c.classList.toggle('off',!ON[g.k]);
  c.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===S[g.k]));
  c.querySelector('[data-on]').checked=ON[g.k];
  const ta=c.querySelector('.cust');ta.hidden=!isCu;
  const d=c.querySelector('.desc');d.hidden=isCu;d.textContent=isCu?'':g.items[S[g.k]][1].replace('{S}','');
 });
 render();
}

// ---------- compose ----------
function val(k){
 if(!ON[k])return null;
 const g=GM[k],it=g.items[S[k]];
 return S[k]===g.items.length-1?(CU[k].trim()||`[Insert custom ${g.t.toLowerCase()}]`):it[1];
}
function compose(){
 const L=LANG[+$('#lang').value],T=$('#title').value.trim(),P=[];
 const add=(text,cls)=>P.push({text,cls});
 let v=val('layout');if(v)add('A professional graphic design, '+v);
 const sub=val('subject'),art=val('art');
 if(sub)add(`[TOP EMBELLISHMENT]: Centered prominently at the top is ${dot(sub).replace(/^./,m=>m)}${art?` Rendered in the style of: ${dot(art)}`:''}`);
 else if(art)add(`[ART STYLE]: ${dot(art)}`);
 if(v=val('bg'))add(`[BACKGROUND & FRAME]: ${dot(v)}`);
 if(v=val('palette'))add(`[COLOR PALETTE]: ${dot(v)}`);
 if(v=val('panel'))add(`[TEXT PANEL]: ${dot(v)}`);
 if(v=val('heading')){
  const hf=val('hfont');
  add(`[HEADING]: ${dot(v)} The title is written exactly as: "${T}".${hf?` Lettering: ${dot(hf.replace('{S}',L[0]))}`:''}`);
 }
 if(v=val('bodyStyle')){
  const bf=val('bfont');
  add(`[BODY TEXT LAYOUT]: ${dot(v)}${bf?` Font: ${dot(bf.replace('{S}',L[0]))}`:''}`);
 }
 if($('#onText').checked){
  const lines=$('#body').value.split('\n').map(s=>s.trim()).filter(Boolean);
  $('#lc').textContent=lines.length+' lines';
  add(`[THE TEXT TO RENDER]${LV>1?` (${lines.length} lines, in this exact order, each on its own row)`:''}:\n`+lines.map(s=>`"${s}"`).join('\n'));
 }
 if(v=val('border'))add(`[BORDER]: ${dot(v)}`);
 if(LV>=2)add(`[COMPOSITION]: Strict top-to-bottom hierarchy. The deity illustration occupies roughly the top 35% of the canvas, the heading banner sits directly beneath it, and the text panel fills the lower area. Everything is centered with symmetrical balance and a safe margin of about 6% on all sides. No decoration may overlap or reduce the readability of any text.`,'c');
 if($('#onGuard').checked)add(`[CRITICAL INSTRUCTIONS FOR TYPOGRAPHY & RENDERING]:
- Render the ${L[1]} text exactly as provided, preserving every character, including ${L[2]}.
- Do not translate, transliterate, paraphrase, add, or drop any word.
- Every character must be sharp, high-resolution, perfectly legible, and free of typos, distortion, or blur.
- Keep clean spacing between lines so the layout feels like a professionally designed poster.${LV>=2?'\n- The heading must be noticeably larger than the body text, and all body lines must share the same size and alignment.':''}`,'g');
 if(LV>=2)add(`[QUALITY]: Ultra-sharp, 4K detail, print-ready, balanced contrast, polished professional poster design with the deity's face clear, serene and anatomically correct.`,'c');
 if(LV>=3)add(`[NEGATIVE]: No extra or missing limbs or fingers, no duplicated faces, no cropped heads, no watermarks or logos, no random or gibberish text, no garbled ${L[0]} glyphs, no clutter behind the text, no text outside the specified lines.`,'n');
 return P;
}
function render(){
 const P=compose(),out=$('#out');out.innerHTML='';
 P.forEach(p=>{const d=document.createElement('div');d.className='part '+(p.cls||'');d.textContent=p.text;out.appendChild(d);});
 const t=plain();
 $('#stats').textContent=`${t.length} characters · ${t.split(/\s+/).filter(Boolean).length} words`;
}
const plain=()=>compose().map(p=>p.text).join('\n\n');

// ---------- events ----------
groups.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;S[b.dataset.k]=+b.dataset.i;sync();});
groups.addEventListener('change',e=>{const k=e.target.dataset.on;if(k){ON[k]=e.target.checked;sync();}});
groups.addEventListener('input',e=>{if(e.target.classList.contains('cust')){CU[e.target.closest('.card').id.slice(5)]=e.target.value;render();}});
['#lang','#title','#body','#onText'].forEach(s=>$(s).addEventListener('input',render));
$('#lv').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;LV=+b.dataset.v;lv();render();});
function lv(){document.querySelectorAll('#lv button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===LV));}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function copy(){navigator.clipboard.writeText(plain()).then(()=>toast('Prompt copied'),()=>toast('Copy failed. Select the text manually.'));}
$('#copy').onclick=$('#copy2').onclick=copy;
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([plain()],{type:'text/plain;charset=utf-8'}));a.download='poster-prompt.txt';a.click();URL.revokeObjectURL(a.href);};
$('#theme').onclick=()=>{const d=document.documentElement,dk=d.dataset.theme==='dark';dk?d.removeAttribute('data-theme'):d.dataset.theme='dark';$('#theme').textContent=dk?'Dark mode':'Light mode';};
if(matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.dataset.theme='dark';$('#theme').textContent='Light mode';}

// guardrails toggle lives in the aside-free form: add as its own card
const gc=document.createElement('div');gc.className='card';gc.innerHTML='<div class="ch"><label><input type="checkbox" id="onGuard" checked> Typography guardrails</label><small>Script-specific rules so text renders exactly</small></div>';
groups.appendChild(gc);gc.querySelector('input').addEventListener('change',render);
lv();sync();
</script>
</body>
